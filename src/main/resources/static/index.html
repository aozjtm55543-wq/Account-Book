<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가계부</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4">원림 님의 가계부</h2>

    <div class="card mb-4">
        <div class="card-body">
            <form id="recordForm" class="row g-3">
                <div class="col-md-2">
                    <select class="form-select" id="type" required>
                        <option value="EXPENSE">지출</option>
                        <option value="INCOME">수입</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" id="amount" placeholder="금액" required>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="category" required>
                        <option value="" disabled selected>카테고리 선택</option>
                        <option value="식비">식비</option>
                        <option value="교통비">교통비</option>
                        <option value="쇼핑">쇼핑</option>
                        <option value="문화생활">문화생활</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="date" required>
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" id="memo" placeholder="메모">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4 border-0 bg-transparent">
        <div class="row g-2 justify-content-end">
            <div class="col-auto">
                <select class="form-select" id="searchType">
                    <option value="memo">메모로 검색</option>
                    <option value="category">카테고리로 검색</option>
                </select>
            </div>
            <div class="col-auto">
                <input type="text" class="form-control" id="searchInput" placeholder="검색어 입력">
            </div>
            <div class="col-auto">
                <button class="btn btn-secondary" onclick="searchRecords()">검색</button>
                <button class="btn btn-outline-secondary" onclick="loadRecords()">전체보기</button>
            </div>
        </div>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>유형</th>
            <th>금액</th>
            <th>카테고리</th>
            <th>날짜</th>
            <th>메모</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody id="recordTableBody">
        </tbody>
    </table>
</div>

<script>
    const API_URL = '/api/records';

    document.getElementById('recordForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const record = {
            type: document.getElementById('type').value,
            amount: parseInt(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            date: document.getElementById('date').value,
            memo: document.getElementById('memo').value
        };

        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(record)
        });

        if (response.status === 201) {
            document.getElementById('recordForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            loadRecords();
        } else {
            alert('등록에 실패했습니다.');
        }
    });

    function displayTable(records) {
        const tbody = document.getElementById('recordTableBody');
        tbody.innerHTML = '';

        records.forEach(record => {
            const tr = document.createElement('tr');

            const typeBadge = record.type === 'INCOME'
                ? '<span class="badge bg-success">수입</span>'
                : '<span class="badge bg-danger">지출</span>';

            tr.innerHTML = `
                <td class="align-middle">${typeBadge}</td>
                <td class="align-middle fw-bold">${record.amount.toLocaleString()}원</td>
                <td class="align-middle">${record.category}</td>
                <td class="align-middle">${record.date}</td>
                <td class="align-middle">${record.memo}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteRecord(${record.id})">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function loadRecords() {
        const response = await fetch(API_URL);
        const records = await response.json();
        displayTable(records);
    }

    async function searchRecords() {
        const searchType = document.getElementById('searchType').value;
        const searchInput = document.getElementById('searchInput').value;

        if (!searchInput) {
            alert('검색어를 입력해주세요!');
            return;
        }

        let url = '';
        if (searchType === 'memo') {
            url = `${API_URL}/search?keyword=${searchInput}`;
        } else if (searchType === 'category') {
            url = `${API_URL}/search/category?category=${searchInput}`;
        }

        const response = await fetch(url);
        const records = await response.json();
        displayTable(records);
    }

    async function deleteRecord(id) {
        if (confirm('정말 삭제하시겠습니까?')) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            if (response.status === 204) {
                loadRecords();
            } else {
                alert('삭제에 실패했습니다.');
            }
        }
    }

    document.getElementById('date').valueAsDate = new Date();
    loadRecords();
</script>
</body>
</html>
